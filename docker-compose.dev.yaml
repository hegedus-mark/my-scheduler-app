services:
  # ASP.NET Core Backend
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      target: development
    ports:
      - "5000:80"
    environment:
      - ConnectionStrings__DefaultConnection=Server=db;Database=scheduler_db;User Id=sa;Password=YourStrong!Passw0rd;Encrypt=false;
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - db

  # Angular Frontend
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      target: development
    ports:
      - "4200:80"
    depends_on:
      - backend

  # MSSQL Database
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql

volumes:
  mssql-data:
