<div class="p-6 max-w-7xl mx-auto">
  <!-- Action bar -->
  <div class="flex gap-3 items-center mb-6">
    <div class="form-control w-full max-w-md">
      <input
        type="text"
        placeholder="Search tasks..."
        class="input input-bordered w-full"
        [(ngModel)]="searchQuery"
      />
    </div>

    <!-- Filters -->
    <div class="flex gap-2">
      @for (priority of priorities; track priority) {
        <button
          class="btn btn-sm btn-outline"
          [class.btn-active]="selectedPriorities().includes(priority)"
          (click)="togglePriorityFilter(priority)"
        >
          {{ priority }}
        </button>
      }

      <button
        class="btn btn-sm btn-outline"
        [class.btn-active]="showDraftsOnly"
        (click)="toggleDraftFilter()"
      >
        Drafts
      </button>
    </div>

    <!-- Create button-->
    <div>
      <button class="btn btn-primary btn-sm" (click)="openModal()">
        Create
        <lucide-icon [img]="Plus" class="w-5 h-5" />
      </button>
    </div>
  </div>

  <!-- Task List -->
  <div class="join join-vertical w-full">
    @for (task of tasksWithSelection(); track task.id) {
      <div class="collapse collapse-arrow join-item border border-base-300">
        <input
          type="radio"
          name="tasks-accordion"
          [checked]="expandedTaskId === task.id"
          (change)="expandTask(task.id)"
        />
        <div class="collapse-title flex items-center gap-4">
          <input
            type="checkbox"
            class="checkbox"
            [checked]="task.selected"
            (change)="toggleTaskSelection(task.id)"
          />
          <div class="flex-1">
            <div class="flex justify-between items-center">
              <h3 class="font-medium">{{ task.name }}</h3>
              @if (task.status === "Draft") {
                <span class="badge badge-outline">Draft</span>
              }
            </div>
            <div class="text-sm opacity-70 flex gap-2 mt-1">
              <span class="badge" [class]="getPriorityClass(task.priority)">
                {{ task.priority }}
              </span>
              <span>Due: {{ task.dueDate }}</span>
            </div>
          </div>
        </div>
        <!-- Actions -->
        <div class="mt-4 flex gap-2">
          <button class="btn btn-sm btn-outline" (click)="editTask(task)">
            Edit Task
          </button>
        </div>
      </div>
    }
  </div>
  <app-create-modal allowEventCreation="false" />
</div>
