<div class="date-picker-container dropdown">
  <div class="date-picker-input w-full">
    <input
      type="text"
      [placeholder]="placeholder()"
      [value]="formattedSelectedDate()"
      readonly
      [disabled]="disabled()"
      class="input input-bordered"
      (click)="toggleCalendar()"
    />
    <span class="calendar-icon">📅</span>
  </div>

  @if (showCalendar()) {
    <div class="dropdown-content dropdown-open card shadow-lg">
      <div class="calendar-header card-body p-2">
        <button (click)="previousMonth()" class="btn btn-ghost btn-sm">
          &lt;
        </button>
        <span class="month-year font-medium">
          {{ currentMonth() | date: "MMMM yyyy" }}
        </span>
        <button (click)="nextMonth()" class="btn btn-ghost btn-sm">&gt;</button>
      </div>

      <div class="calendar-body p-2">
        <div class="weekdays">
          @for (
            day of ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
            track day
          ) {
            <div class="weekday">{{ day }}</div>
          }
        </div>

        <div class="calendar-grid">
          @for (cell of calendarDays(); track cell.date) {
            <div
              class="day"
              [class.current-month]="cell.currentMonth"
              [class.selected]="isSelected(cell.date)"
              [class.disabled]="isDisabled(cell.date)"
              (click)="!isDisabled(cell.date) && selectDate(cell.date)"
            >
              {{ cell.date.getDate() }}
            </div>
          }
        </div>
      </div>
    </div>
  }
</div>
