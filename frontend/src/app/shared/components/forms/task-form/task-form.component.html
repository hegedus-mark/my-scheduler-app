<form (ngSubmit)="onSubmit()">
  <div class="form-control">
    <label class="label">
      <span class="label-text">Task Name</span>
    </label>
    <input
      type="text"
      class="input input-bordered"
      [(ngModel)]="formState().name"
      name="name"
      required
    />
  </div>

  <div class="form-control">
    <label class="label">
      <span class="label-text">Due Date</span>
    </label>
    <app-date-picker
      [placeholder]="'Select a Due Date'"
      [(ngModel)]="formState().dueDate"
      name="dueDate"
      required
    />
  </div>

  <div class="form-control">
    <label class="label">
      <span class="label-text">Estimated Duration (HH:mm)</span>
    </label>
    <input
      type="text"
      class="input input-bordered"
      [ngModel]="durationString()"
      (ngModelChange)="onDurationChange($event)"
      name="duration"
      placeholder="00:00"
      pattern="^[0-9]{1,2}:[0-9]{2}$"
      required
    />
    @if (!validateDuration(durationString())) {
      <label class="label">
        <span class="label-text-alt text-error">
          Please enter a valid duration (HH:mm)
        </span>
      </label>
    }
  </div>

  <div class="form-control">
    <label class="label">
      <span class="label-text">Priority</span>
    </label>
    <select
      class="select select-bordered"
      [(ngModel)]="formState().priority"
      name="priority"
    >
      @for (priority of priorities; track priority) {
        <option [value]="priority">{{ priority }}</option>
      }
    </select>
  </div>

  <div class="modal-action">
    <button type="submit" class="btn btn-primary">Create Task</button>
  </div>
</form>
